<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Notre soirée à deux · TAYRI</title>
<link rel="stylesheet" href="/assets/maison.css">
<style>
  /* Soirées à deux à distance (Lamia, 17 nov. 2026) : la salle virtuelle du couple, au fond choisi à la réservation. */
  body.soiree { margin: 0; min-height: 100vh; color: #fff; font-family: var(--sans, system-ui, sans-serif); background: #2a1420 center/cover no-repeat; }
  body.soiree::before { content: ""; position: fixed; inset: 0; background: rgba(20,8,14,.45); z-index: -1; }
  .so-entree, .so-fin { max-width: 520px; margin: 0 auto; padding: 8vh 16px 40px; text-align: center; }
  .so-entree h1, .so-fin h1 { font-family: var(--serif, Georgia, serif); font-weight: 400; font-size: clamp(28px, 6vw, 40px); margin: 0 0 6px; }
  .so-theme { color: #f3d9a4; letter-spacing: .04em; margin: 0 0 14px; }
  .so-entree video { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 20px; background: #000; margin: 14px 0; border: 1px solid rgba(243,217,164,.6); box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .so-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; font: 600 16px var(--sans, system-ui, sans-serif); cursor: pointer; background: linear-gradient(180deg, #a3263f, #6e1428); color: #fff; box-shadow: 0 4px 16px rgba(110,20,40,.5), inset 0 1px 0 rgba(255,255,255,.25); }
  .so-btn.is-verre { background: rgba(255,255,255,.16); border: 1px solid rgba(243,217,164,.55); box-shadow: none; backdrop-filter: blur(8px); }
  .so-btn[aria-pressed="false"] { opacity: .6; }
  .so-btn.is-rouge { background: #b3261e; }
  .so-statut { min-height: 1.4em; color: #f7e7c8; }
  .so-appel { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto; }
  .so-videos { position: relative; min-height: 0; padding: 16px; }
  .so-grille { height: 100%; display: grid; place-items: center; }
  .so-tuile { position: relative; width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16/9; border-radius: 22px; overflow: hidden; background: #000; border: 1px solid rgba(243,217,164,.6); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .so-tuile video { width: 100%; height: 100%; object-fit: cover; }
  .so-tuile span { position: absolute; left: 12px; bottom: 10px; padding: 2px 12px; border-radius: 999px; background: rgba(0,0,0,.5); font-size: 14px; }
  .so-attente { font-family: var(--serif, Georgia, serif); font-size: 22px; text-align: center; padding: 0 16px; }
  .so-moi { position: absolute; right: 24px; bottom: 24px; width: min(220px, 34vw); aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid rgba(243,217,164,.6); box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 2; }
  .so-moi video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .so-programme { position: absolute; left: 24px; top: 24px; z-index: 3; width: min(360px, calc(100% - 48px)); max-height: calc(100% - 48px); overflow: auto; padding: 16px 18px; border-radius: 20px; background: rgba(255,248,240,.93); color: #3a1f27; border: 1px solid #e7cf9f; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .so-programme h2 { font-family: var(--serif, Georgia, serif); font-weight: 400; color: #7a1f35; margin: 0 0 4px; font-size: 22px; }
  .so-programme .so-sous { margin: 0 0 10px; font-size: 14px; color: #7b5a52; }
  .so-etape { border-radius: 14px; padding: 10px 12px; margin: 0 0 8px; background: #fff; border: 1px solid #f0e2c8; }
  .so-etape.is-en-cours { border-color: #b8893e; box-shadow: 0 0 0 2px rgba(184,137,62,.3); }
  .so-etape h3 { margin: 0 0 4px; font-size: 16px; color: #7a1f35; }
  .so-etape p { margin: 0 0 6px; font-size: 14px; line-height: 1.45; }
  .so-etape ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
  .so-nav { display: flex; gap: 8px; justify-content: space-between; margin-top: 8px; }
  .so-nav button { min-height: 40px; border: 1px solid #d9bf8c; border-radius: 999px; padding: 0 14px; background: #fff; color: #7a1f35; font-weight: 600; cursor: pointer; }
  .so-barre { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(20,8,14,.5); backdrop-filter: blur(8px); }
  @media (max-width: 700px) { .so-programme { left: 12px; top: 12px; width: calc(100% - 24px); max-height: 45%; } .so-moi { right: 12px; bottom: 12px; } }
</style>
</head>
<body class="soiree">

<section class="so-entree" data-etape="entree">
  <h1>Votre soirée à deux</h1>
  <p class="so-theme" data-theme-nom></p>
  <p>Votre fond de soirée est posé automatiquement. Rien n’est enregistré : c’est rien qu’à vous deux.</p>
  <video data-apercu autoplay muted playsinline></video>
  <p class="so-statut" role="status" data-statut></p>
  <p><button class="so-btn" type="button" data-entrer>Entrer dans notre salle</button></p>
</section>

<section class="so-appel" data-etape="appel" hidden>
  <div class="so-videos">
    <div class="so-grille" data-grille><p class="so-attente" data-attente>Votre salle est prête. L’autre arrive…</p></div>
    <aside class="so-programme" data-programme hidden aria-label="Le programme d’amour"></aside>
    <div class="so-moi"><video data-video-moi autoplay muted playsinline></video></div>
  </div>
  <div class="so-barre">
    <button class="so-btn is-verre" type="button" data-micro aria-pressed="true">Micro</button>
    <button class="so-btn is-verre" type="button" data-camera aria-pressed="true">Caméra</button>
    <button class="so-btn is-verre" type="button" data-fond>Fond</button>
    <button class="so-btn is-verre" type="button" data-voir-programme hidden>Programme</button>
    <button class="so-btn is-rouge" type="button" data-quitter>Quitter</button>
  </div>
  <div data-audios hidden></div>
</section>

<section class="so-fin" data-etape="fin" hidden>
  <h1 data-fin-titre>Belle soirée à vous deux</h1>
  <p data-fin-texte>Retrouvez vos moments et réservez la prochaine soirée dans votre espace.</p>
  <p><a class="so-btn" href="/notre-couple/?onglet=planning">Notre couple</a></p>
</section>

<script type="module">
import Daily from '/vendor/daily.mjs';

const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const THEMES = { chandelles: 'Dîner aux chandelles', etoiles: 'Nuit étoilée', mer: 'Coucher de soleil sur la mer', kabyle: 'Soirée kabyle', cinema: 'Cinéma à deux', jardin: 'Jardin fleuri' };
const montrer = (e) => document.querySelectorAll('[data-etape]').forEach((s) => { s.hidden = s.dataset.etape !== e; });
const fin = (t, x) => { if (t) $('[data-fin-titre]').textContent = t; if (x) $('[data-fin-texte]').textContent = x; montrer('fin'); };

// Le lien de la salle arrive dans le #, jamais envoyé au serveur du site.
let salle = null, jeton = '', nom = '', theme = 'chandelles', semaine = 0;
try {
  const u = new URL(decodeURIComponent(location.hash.slice(1)));
  if (u.protocol === 'https:' && /\.daily\.co$/.test(u.hostname)) {
    jeton = u.searchParams.get('t') || ''; nom = (u.searchParams.get('n') || '').slice(0, 60);
    theme = THEMES[u.searchParams.get('th')] ? u.searchParams.get('th') : 'chandelles'; semaine = Number(u.searchParams.get('s')) || 0;
    u.search = ''; salle = u.href;
  }
} catch {}
if (!salle || !jeton) fin('Lien de salle invalide', 'Repassez par Notre couple, onglet Moments, pour entrer dans votre salle.');

const imageTheme = (k) => new URL(`/images/couple/soiree/${k}.jpg`, location.origin).href;
document.body.style.backgroundImage = `url("${imageTheme(theme)}")`;
$('[data-theme-nom]').textContent = THEMES[theme];
// Les fonds proposés : celui de la soirée d'abord, puis les autres thèmes, le flou et aucun.
const FONDS = [theme, ...Object.keys(THEMES).filter((k) => k !== theme)].map((k) => ({ nom: THEMES[k], processor: { type: 'background-image', config: { source: imageTheme(k) } } }))
  .concat([{ nom: 'Flou', processor: { type: 'background-blur', config: { strength: 0.8 } } }, { nom: 'Aucun', processor: { type: 'none' } }]);
let fond = 0;
const traitementOk = (() => { try { return Daily.supportedBrowser().supportsVideoProcessing; } catch { return false; } })();
if (!traitementOk) $('[data-fond]').hidden = true;

const call = Daily.createCallObject({ subscribeToTracksAutomatically: true, dailyConfig: { useDevicePreferenceCookies: true } });
const reglerFond = async () => {
  $('[data-fond]').textContent = `Fond : ${FONDS[fond].nom}`;
  if (!traitementOk) return;
  try { await call.updateInputSettings({ video: { processor: FONDS[fond].processor } }); } catch { /* le fond reste celui d'avant */ }
};
if (salle && jeton) {
  $('[data-statut]').textContent = 'Préparation de ta caméra…';
  call.startCamera({ url: salle, token: jeton, inputSettings: traitementOk ? { video: { processor: FONDS[0].processor } } : undefined })
    .then(() => { $('[data-statut]').textContent = ''; })
    .catch(() => { $('[data-statut]').textContent = 'Autorise la caméra et le micro pour cette page, puis recharge-la.'; });
}

const attacher = (el, track) => { const cur = el.srcObject?.getTracks?.()[0]; if (track && cur?.id === track.id) return; el.srcObject = track ? new MediaStream([track]) : null; };
function afficher() {
  const ps = call.participants(), moi = ps.local;
  attacher($('[data-apercu]'), moi?.tracks?.video?.persistentTrack);
  attacher($('[data-video-moi]'), moi?.tracks?.video?.persistentTrack);
  const autres = Object.values(ps).filter((p) => !p.local), zone = $('[data-grille]'), audios = $('[data-audios]');
  $('[data-attente]').hidden = autres.length > 0;
  for (const t of zone.querySelectorAll('[data-tuile]')) if (!autres.some((p) => p.session_id === t.dataset.tuile)) t.remove();
  for (const a of audios.querySelectorAll('audio')) if (!autres.some((p) => p.session_id === a.dataset.son)) a.remove();
  for (const p of autres) {
    let t = zone.querySelector(`[data-tuile="${p.session_id}"]`);
    if (!t) { t = document.createElement('div'); t.className = 'so-tuile'; t.dataset.tuile = p.session_id; t.innerHTML = '<video autoplay playsinline></video><span></span>'; zone.append(t); }
    t.querySelector('span').textContent = p.user_name || '';
    attacher(t.querySelector('video'), p.tracks?.video?.state === 'playable' ? p.tracks.video.persistentTrack : null);
    let a = audios.querySelector(`[data-son="${p.session_id}"]`);
    if (!a) { a = document.createElement('audio'); a.autoplay = true; a.dataset.son = p.session_id; audios.append(a); }
    attacher(a, p.tracks?.audio?.state === 'playable' ? p.tracks.audio.persistentTrack : null);
  }
  $('[data-micro]').setAttribute('aria-pressed', String(call.localAudio()));
  $('[data-camera]').setAttribute('aria-pressed', String(call.localVideo()));
}
for (const ev of ['participant-joined', 'participant-updated', 'participant-left', 'track-started', 'track-stopped', 'joined-meeting', 'started-camera']) call.on(ev, afficher);
call.on('left-meeting', () => fin());
call.on('error', (e) => { const m = String(e?.errorMsg || e?.error?.type || ''); fin('La salle s’est fermée', /exp/i.test(m) ? 'Le temps de votre soirée est terminé.' : 'Repassez par Notre couple pour entrer à nouveau.'); });

// Le programme d'amour de la soirée, étape par étape (le même chez les deux, chacun avance à son rythme).
let programme = null, etape = 0;
async function chargerProgramme() {
  if (!semaine) return;
  try { const r = await fetch('/assets/couple-soirees-demo.js'); const txt = await r.text(); const m = txt.match(/PROGRAMME_DEMO = (\[.*\]);/s); programme = m ? JSON.parse(m[1]).find((w) => w.semaine === semaine) : null; } catch { programme = null; }
  if (!programme) return;
  $('[data-voir-programme]').hidden = false; $('[data-programme]').hidden = false; dessinerProgramme();
}
function dessinerProgramme() {
  const p = programme, e = p.etapes[etape];
  $('[data-programme]').innerHTML = `<h2>Soirée ${p.semaine} · ${esc(p.nom)}</h2><p class="so-sous">${esc(p.texte)} · étape ${etape + 1} sur ${p.etapes.length}</p>
    <div class="so-etape is-en-cours"><h3>${esc(e.titre)}${e.minutes ? ` · ${e.minutes} min` : ''}</h3><p>${esc(e.texte)}</p>${e.questions ? `<ul>${e.questions.map((q) => `<li>${esc(q)}</li>`).join('')}</ul>` : ''}</div>
    <div class="so-nav"><button type="button" data-prec ${etape === 0 ? 'disabled' : ''}>‹ Avant</button><button type="button" data-masquer>Masquer</button><button type="button" data-suiv ${etape >= p.etapes.length - 1 ? 'disabled' : ''}>Ensuite ›</button></div>`;
}
$('[data-programme]').addEventListener('click', (e) => {
  if (e.target.closest('[data-prec]')) { etape = Math.max(0, etape - 1); dessinerProgramme(); }
  if (e.target.closest('[data-suiv]')) { etape = Math.min(programme.etapes.length - 1, etape + 1); dessinerProgramme(); }
  if (e.target.closest('[data-masquer]')) $('[data-programme]').hidden = true;
});
$('[data-voir-programme]').addEventListener('click', () => { $('[data-programme]').hidden = !$('[data-programme]').hidden; });

$('[data-entrer]').addEventListener('click', async (e) => {
  e.target.disabled = true; $('[data-statut]').textContent = 'Ouverture de votre salle…';
  try { await call.join({ url: salle, token: jeton, userName: nom || undefined }); montrer('appel'); await reglerFond(); afficher(); chargerProgramme(); }
  catch { e.target.disabled = false; $('[data-statut]').textContent = 'La salle ne s’ouvre pas. Réessaie dans un instant.'; }
});
$('[data-micro]').addEventListener('click', () => { call.setLocalAudio(!call.localAudio()); afficher(); });
$('[data-camera]').addEventListener('click', () => { call.setLocalVideo(!call.localVideo()); afficher(); });
$('[data-fond]').addEventListener('click', () => { fond = (fond + 1) % FONDS.length; reglerFond(); });
$('[data-quitter]').addEventListener('click', () => { call.leave().catch(() => fin()); });
</script>
</body>
</html>
