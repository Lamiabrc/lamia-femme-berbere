<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sécurité & alertes — Lamia Femme Berbère</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#b51e36;--pink:#fff5f7;--ink:#181214;--muted:#75666a;--line:#ecdde1;--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#fffafc;color:var(--ink);font-family:var(--sans)}
header{padding:22px 5vw;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--serif);font-size:28px}.brand span{color:var(--red)}main{padding:5vw;max-width:1300px;margin:auto}
h1{font-family:var(--serif);font-size:clamp(48px,6vw,82px);margin:0;line-height:.95}.sub{color:var(--muted);max-width:650px;line-height:1.7}
.login{max-width:480px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;margin-top:34px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;margin:6px 0 12px;font:inherit}
button{border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:var(--ink);color:#fff}.soft{background:#fff0f3;color:var(--red)}
.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:30px 0;flex-wrap:wrap}.tabs{display:flex;gap:8px}.tabs button.active{background:var(--red);color:#fff}
.grid{display:grid;gap:14px}.alert-card{background:#fff;border:1px solid var(--line);border-left:7px solid #e8c341;border-radius:22px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px}.alert-card.orange{border-left-color:#e58a2a}.alert-card.red{border-left-color:#c42038}.meta{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:12px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff3f5;font-size:11px}.alert-card h3{font-family:var(--serif);font-size:29px;margin:8px 0}.details{line-height:1.6;color:#51464a}.actions{display:flex;flex-direction:column;gap:8px;min-width:150px}.empty{padding:50px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:24px}.hidden{display:none!important}.status{font-size:12px;color:var(--muted)}
@media(max-width:760px){.alert-card{grid-template-columns:1fr}.actions{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="brand">Lamia <span>Femme Berbère</span></div><a href="/">← Retour au site</a></header>
<main>
<p style="text-transform:uppercase;letter-spacing:.18em;color:#b51e36;font-size:11px;font-weight:700">Espace privé</p>
<h1>Sécurité & alertes</h1>
<p class="sub">Les signalements sont confidentiels. Le profil signalé ne voit jamais l’identité de la personne qui a alerté Lamia.</p>

<section id="loginBox" class="login">
<h2>Connexion administratrice</h2>
<form id="loginForm"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Mot de passe" required><button class="primary">Me connecter</button></form>
<p class="status" id="loginStatus"></p>
</section>

<section id="dashboard" class="hidden">
<div class="toolbar"><div class="tabs"><button class="active" data-sev="all">Toutes</button><button data-sev="red">Rouges</button><button data-sev="orange">Oranges</button><button data-sev="yellow">Jaunes</button></div><button class="soft" id="logout">Déconnexion</button></div>
<div class="grid" id="alerts"></div>
</section>
</main>
<script type="module" src="admin.js"></script>
</body></html>
