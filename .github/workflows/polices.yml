name: polices
on: workflow_dispatch
permissions:
  contents: write
jobs:
  polices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir -p public/fonts
          get() { curl -sSfL "https://cdn.jsdelivr.net/npm/@fontsource/$1@5/files/$1-latin-$2-$3.woff2" -o "public/fonts/$1-$2-$3.woff2"; }
          for w in 500 600 700; do get cormorant-garamond $w normal; done
          get cormorant-garamond 500 italic
          for w in 400 500 600 700; do get dm-sans $w normal; get inter $w normal; done
          get playfair-display 600 normal
          get playfair-display 500 italic
          ls -la public/fonts
          git config user.name "polices-bot"; git config user.email "polices-bot@users.noreply.github.com"
          git add public/fonts && git commit -m "Polices hébergées sur le site (RGPD : plus d'appel à Google Fonts)" && git push
