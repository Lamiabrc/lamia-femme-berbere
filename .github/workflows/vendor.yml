name: vendor
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          set -e
          mkdir -p /tmp/v && cd /tmp/v && npm init -y >/dev/null
          npm i --no-audit --no-fund @supabase/supabase-js@2.117.2 @daily-co/daily-js@0.89.1 esbuild@0.24.0
          echo "export { createClient } from '@supabase/supabase-js';" > supa.js
          echo "export { default } from '@daily-co/daily-js';" > daily.js
          npx esbuild supa.js --bundle --format=esm --minify --platform=browser --outfile=supabase.mjs
          npx esbuild daily.js --bundle --format=esm --minify --platform=browser --outfile=daily.mjs
          cd $GITHUB_WORKSPACE && mkdir -p public/vendor && cp /tmp/v/supabase.mjs /tmp/v/daily.mjs public/vendor/ && ls -la public/vendor
          git config user.name "vendor-bot"; git config user.email "vendor-bot@users.noreply.github.com"
          git add public/vendor && git commit -m "Bibliothèques hébergées sur le site (RGPD : plus d'appel à jsDelivr)" && git push
