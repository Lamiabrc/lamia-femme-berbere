name: sonde-api
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://lamia-femme-berbere.com
          echo "::warning::patio $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' $B/patio/)"
          echo "::warning::rencontres $(curl -s -o /dev/null -w '%{http_code}' $B/rencontres/)"
          echo "::warning::accueil $(curl -s $B/ | grep -o '<title>[^<]*' | head -1)"
