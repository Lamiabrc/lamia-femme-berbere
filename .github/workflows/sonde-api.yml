name: sonde-api
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://lamia-femme-berbere.com
          echo "::warning::vendor $(curl -sI $B/vendor/supabase.mjs | grep -i '^content-type' | tr -d '\r')"
          echo "::warning::font $(curl -sI $B/fonts/inter-400-normal.woff2 | grep -i '^content-type' | tr -d '\r')"
          echo "::warning::google $(curl -s $B/ | grep -c 'fonts.googleapis')"
