name: sonde-api
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          t() { r=$(curl -sSL -m 30 -X POST -H 'Content-Type: application/json' -d "$2" -w ' HTTP %{http_code}' https://lamia-femme-berbere.com/api/confidences | tr '\n' ' ' | cut -c1-300); echo "::warning title=$1::$r"; }
          t publiques '{"action":"annonces_publiques"}'
          t sansaccord '{"action":"annonce_deposer","prenom":"X"}'
          t admin '{"action":"annonces_admin"}'
